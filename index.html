<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Centralizado - Anime V1</title>
    <style>
        :root { --accent: #ff0055; --bg: #0b0f19; --card: #111827; --cyan: #00ffcc; --text: #f3f4f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .auth-box, .dashboard { max-width: 1000px; margin: 30px auto; background: var(--card); padding: 30px; border-radius: 12px; border: 1px solid #1f2937; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 25px; }
        
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; color: var(--cyan); margin-bottom: 5px; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #374151; background: #030712; color: #fff; box-sizing: border-box; font-size: 14px; }
        input:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 8px rgba(255,0,85,0.3); }
        
        button { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; width: 100%; transition: 0.3s; font-size: 13px; margin-top: 10px; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:disabled { background: #374151; cursor: not-allowed; opacity: 0.6; }
        
        .btn-clear { background: #374151 !important; color: #f87171 !important; margin-top: 8px; }
        .btn-preview { background: #2563eb !important; color: white !important; margin-bottom: 10px; }
        
        .server-section { background: #030712; border: 1px solid #1f2937; border-radius: 8px; padding: 18px; margin: 20px 0; }
        .server-section-title { color: var(--cyan); font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; border-bottom: 1px solid #1f2937; padding-bottom: 8px; }

        .nav-tabs { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 1px solid #1f2937; padding-bottom: 12px; }
        .nav-tabs button { flex: 1; background: #1f2937; color: #9ca3af; margin-top: 0; }
        .nav-tabs button.active { background: var(--accent); color: #fff; }
        
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        
        .row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 15px; }
        .logout-bar { display: flex; justify-content: space-between; align-items: center; background: #030712; padding: 10px 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #1f2937; }
        .logout-btn { background: #374151; color: #f87171; width: auto; padding: 6px 15px; font-size: 11px; margin-top: 0; }
        
        .preview-edit-box { background: #030712; border: 1px solid #374151; border-radius: 8px; padding: 15px; margin-top: 15px; display: none; }
        
        textarea#seriesResultCode, textarea#epResultCode { height: 120px; font-family: monospace; font-size: 11px; resize: none; }
        .status-msg { text-align: center; font-size: 13px; font-weight: bold; margin-top: 10px; min-height: 20px; color: #fbbf24; }
        .google-auth-box { background: #030712; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #1f2937; display: flex; justify-content: space-between; align-items: center; }
        .action-btn { background: #2563eb; padding: 5px 10px; font-size: 11px; width: auto; margin-top: 0; margin-left: 10px; }

        .history-badge { background: #1f2937; color: #00ffcc; padding: 6px 12px; border-radius: 6px; font-size: 12px; margin-bottom: 12px; border: 1px solid #374151; display: inline-block; }

        @keyframes color-gif { 
            0%, 100% { border-color: #ff0055; color: #ff0055; box-shadow: 0 0 10px rgba(255,0,85,0.4); } 
            50% { border-color: #00ffcc; color: #00ffcc; box-shadow: 0 0 15px rgba(0,255,204,0.6); } 
        }
        .anim-gif-border { animation: color-gif 2s infinite linear; }
    </style>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAl1LauNyrok_RCHnfQcPYJZj6d2FMeL9Y",
            authDomain: "panel-animev1-eda50.firebaseapp.com",
            projectId: "panel-animev1-eda50",
            storageBucket: "panel-animev1-eda50.firebasestorage.app",
            messagingSenderId: "77184385205",
            appId: "1:77184385205:web:349a3adad987c04e303efc",
            measurementId: "G-Z86WC7H1C2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let googleAccessToken = null;
        const CLIENT_ID = "77184385205-rlatusv7sersid56ju1vr32dd4b53q1v.apps.googleusercontent.com";

        let tokenClient;
        window.onload = function () {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/blogger',
                callback: (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        googleAccessToken = tokenResponse.access_token;
                        document.getElementById('googleAuthStatus').innerText = "🟢 Conectado a Blogger API";
                        document.getElementById('googleAuthStatus').style.color = "#00ffcc";
                    }
                },
            });
        };

        window.connectBlogger = function() {
            if(tokenClient) { tokenClient.requestAccessToken(); }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('authView').style.display = 'none';
                document.getElementById('dashboardView').style.display = 'block';
                document.getElementById('userEmailDisplay').innerText = user.email;
                loadDatabaseSeries();
            } else {
                document.getElementById('authView').style.display = 'block';
                document.getElementById('dashboardView').style.display = 'none';
            }
        });

        window.loginUser = function() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, pass)
                .catch(error => alert("Error de acceso: " + error.message));
        };

        window.logoutUser = function() { signOut(auth); };

        async function loadDatabaseSeries() {
            const container = document.getElementById('dbListContainer');
            container.innerHTML = "Cargando series desde Firestore...";
            try {
                const querySnapshot = await getDocs(collection(db, "anime_series"));
                if(querySnapshot.empty) {
                    container.innerHTML = "No hay series registradas en la base de datos todavía.";
                    return;
                }
                let html = "<ul style='list-style:none; padding:0; text-align:left;'>";
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const docId = docSnap.id;
                    html += `<li style="background:#111827; padding:12px; margin-bottom:8px; border-radius:5px; border-left:3px solid #ff0055; display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <b>ID AniList:</b> ${data.aniId} | <b>Título:</b> ${data.title} | <b>Estado:</b> <span style="color:#00ffcc;">${data.status}</span>
                        </div>
                        <div>
                            ${data.status !== 'Completed' ? `<button class="action-btn" onclick="updateSeriesStatus('${docId}')">Marcar Finalizado</button>` : `<span style="font-size:11px; color:#10b981;">✓ Finalizado</span>`}
                        </div>
                    </li>`;
                });
                html += "</ul>";
                container.innerHTML = html;
            } catch(e) {
                container.innerHTML = "Error al cargar la base de datos: " + e.message;
            }
        }

        window.updateSeriesStatus = async function(docId) {
            try {
                const seriesRef = doc(db, "anime_series", docId);
                await updateDoc(seriesRef, { status: "Completed" });
                alert("¡Estado actualizado a Completed en Firestore!");
                loadDatabaseSeries();
            } catch(e) {
                alert("Error al actualizar estado: " + e.message);
            }
        }

        async function translateToSpanish(text) {
            if (!text) return "Sin sinopsis disponible.";
            const cleanText = text.replace(/<[^>]*>?/gm, '');
            try {
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(cleanText)}&langpair=en|es`);
                const data = await res.json();
                if (data && data.responseData && data.responseData.translatedText) {
                    return data.responseData.translatedText;
                }
            } catch (e) {
                console.error("Error traduciendo sinopsis:", e);
            }
            return cleanText;
        }

        let cachedSeriesData = null;

        window.fetchSeriesDataForEdit = async function() {
            const source = document.getElementById('dataSource').value;
            const animeId = document.getElementById('seriesAniId').value.trim();
            const statusEl = document.getElementById('seriesStatus');

            if(!animeId) { alert("Ingresa un ID válido primero."); return; }
            statusEl.innerText = `⏳ Consultando ${source === 'anilist' ? 'AniList' : 'MyAnimeList'} para edición...`;

            try {
                let title = "", description = "", status = "", format = "", genres = [], coverImg = "", nextEpNumber = 1, trailerId = "", externalLinks = [], characters = [], season = "", seasonYear = "";

                if (source === 'anilist') {
                    const query = `query ($id: Int) { Media (id: $id, type: ANIME) { id title { romaji english } description status format genres season seasonYear coverImage { extraLarge } trailer { id site } nextAiringEpisode { episode } externalLinks { site type } studios(isMain: true) { nodes { name } } characters (sort: ROLE, perPage: 6) { edges { node { name { full } image { medium } } voiceActors (language: JAPANESE) { name { full } } } } } }`;
                    const response = await fetch('https://graphql.anilist.co', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ query, variables: { id: parseInt(animeId) } })
                    });
                    const resData = await response.json();
                    if(resData.errors) { statusEl.innerText = "❌ Error: ID no encontrado en AniList."; return; }
                    
                    const anime = resData.data.Media;
                    title = anime.title.romaji || anime.title.english;
                    description = anime.description;
                    status = anime.status;
                    format = anime.format;
                    genres = anime.genres || [];
                    season = anime.season;
                    seasonYear = anime.seasonYear;
                    coverImg = anime.coverImage.extraLarge;
                    if(anime.trailer && anime.trailer.site && anime.trailer.site.toLowerCase() === 'youtube') { trailerId = anime.trailer.id; }
                    if(anime.nextAiringEpisode) { nextEpNumber = anime.nextAiringEpisode.episode; }
                    externalLinks = anime.externalLinks || [];
                    characters = anime.characters ? anime.characters.edges : [];
                } else {
                    const jikanUrl = `https://api.jikan.moe/v4/anime/${animeId}`;
                    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(jikanUrl)}`;
                    
                    const res = await fetch(proxyUrl);
                    if(!res.ok) throw new Error("No se pudo conectar con MyAnimeList.");
                    
                    const dataWrapper = await res.json();
                    const json = JSON.parse(dataWrapper.contents);

                    if(!json.data) { statusEl.innerText = "❌ Error: ID no encontrado en MyAnimeList."; return; }
                    
                    const anime = json.data;
                    title = anime.title_english || anime.title;
                    description = anime.synopsis;
                    status = anime.status;
                    format = anime.type;
                    genres = anime.genres ? anime.genres.map(g => g.name) : [];
                    coverImg = anime.images.jpg.large_image_url;
                    if(anime.trailer && anime.trailer.youtube_id) { trailerId = anime.trailer.youtube_id; }
                    if(anime.season && anime.year) { season = anime.season; seasonYear = anime.year; }
                }

                statusEl.innerText = "🌐 Traduciendo sinopsis al español...";
                const spanishDesc = await translateToSpanish(description);

                cachedSeriesData = { coverImg, status, format, genres, nextEpNumber, trailerId, externalLinks, characters, season, seasonYear };

                document.getElementById('editSeriesTitle').value = title;
                document.getElementById('editSeriesLabelName').value = title;
                document.getElementById('editSeriesDesc').value = spanishDesc;
                document.getElementById('seriesEditBox').style.display = 'block';
                statusEl.innerText = "✏️ Datos cargados. Puedes modificar el nombre para las etiquetas y el título.";
            } catch(e) {
                statusEl.innerText = "❌ Error: " + e.message;
            }
        };

        window.generateAndSaveSeries = async function() {
            const btn = document.getElementById('btnPublishSeries');
            btn.disabled = true;

            const blogId = document.getElementById('blogId').value.trim();
            const animeId = document.getElementById('seriesAniId').value.trim();
            const tgUrl = document.getElementById('telegramUrl').value.trim() || "https://t.me/animev1net";
            const statusEl = document.getElementById('seriesStatus');

            if(!cachedSeriesData) { alert("Primero haz clic en 'Cargar y Editar Datos' para obtener la información."); btn.disabled = false; return; }
            if(!blogId) { alert("Ingresa tu Blog ID de Blogger."); btn.disabled = false; return; }
            if(!googleAccessToken) { alert("Primero conéctate a la API de Blogger con el botón superior."); btn.disabled = false; return; }

            const title = document.getElementById('editSeriesTitle').value.trim();
            const labelName = document.getElementById('editSeriesLabelName').value.trim() || title;
            const spanishDesc = document.getElementById('editSeriesDesc').value.trim();
            const { coverImg, status, format, genres, nextEpNumber, trailerId, externalLinks, characters, season, seasonYear } = cachedSeriesData;

            statusEl.innerText = "🚀 Preparando etiquetas y publicando...";

            let tags = ["Series", "Sub", labelName];
            if (format) tags.push(format);
            
            let readableStatus = status;
            if(status === "RELEASING" || status === "Currently Airing") readableStatus = "Ongoing";
            else if(status === "FINISHED" || status === "Finished Airing") readableStatus = "Completed";
            else if(status === "NOT_YET_RELEASED") readableStatus = "Upcoming";
            tags.push(readableStatus);

            if (genres.length > 0) { genres.forEach(g => tags.push(g)); }
            
            if (season && seasonYear) {
                const seasonCapitalized = season.charAt(0) + season.slice(1).toLowerCase();
                tags.push(`${seasonCapitalized} ${seasonYear}`);
            }

            const estrenoFecha = "12 de octubre de 2026";

            let streamingHTML = '';
            if (externalLinks.length > 0) {
                const streamingPlatforms = externalLinks.filter(link => 
                    link.type === 'STREAMING' || 
                    ['Crunchyroll', 'Netflix', 'Hulu', 'Amazon', 'Disney Plus', 'Disney+', 'Bilibili', 'HIDIVE'].includes(link.site)
                );
                if (streamingPlatforms.length > 0) {
                    streamingHTML = '<div class="official-platforms" style="background:#0d1117; border:1px solid #21262d; border-radius:8px; padding:12px 18px; margin:15px 0;"><span style="color:#00ffcc; font-size:11px; font-weight:bold; display:block; margin-bottom:8px;">📺 PLATAFORMAS OFICIALES:</span><div style="display:flex; flex-wrap:wrap; gap:8px;">';
                    streamingPlatforms.forEach(p => {
                        streamingHTML += `<div style="background:#161b22; color:#e6edf3; padding:6px 12px; border-radius:4px; font-size:11px; font-weight:bold; border-left:3px solid #00ffcc;">${p.site}</div>`;
                    });
                    streamingHTML += '</div></div>';
                }
            }

            let charactersHTML = '';
            if (characters.length > 0) {
                charactersHTML = '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 20px 0;">';
                characters.forEach(edge => {
                    const charName = edge.node.name.full;
                    const charImg = edge.node.image.medium;
                    const vaName = (edge.voiceActors && edge.voiceActors[0]) ? edge.voiceActors[0].name.full : 'N/A';
                    charactersHTML += `
                    <div style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 5px; display: flex; align-items: center; border-left: 2px solid #ff0055;">
                        <img src="${charImg}" style="width: 35px; height: 35px; border-radius: 50%; margin-right: 10px; object-fit: cover;">
                        <div style="overflow: hidden;"><div style="font-size: 11px; color: #fff; font-weight:bold; overflow:hidden; text-overflow:ellipsis;">${charName}</div><div style="font-size: 9px; color: #ff0055;">${vaName}</div></div>
                    </div>`;
                });
                charactersHTML += '</div>';
            }

            let trailerHtml = trailerId ? `
            <div class="bixbox trailer" style="margin:20px 0; text-align:center;">
                <iframe width="100%" height="315" src="https://www.youtube.com/embed/${trailerId}" frameborder="0" allowfullscreen></iframe>
            </div>` : '';

            const contentHtml = `
<div class="separator" style="clear: both; text-align: center;"><img src="${coverImg}" /></div>

<div class="sinoposis" style="color: #ccc; line-height: 1.6; text-align: justify; margin: 15px 0;"><p>${spanishDesc}</p></div>

${streamingHTML}

<div class="info-box-bar" style="background: #121824; border: 1px solid #1e293b; border-radius: 8px; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin: 20px 0;">
    <div class="tg-info" style="display: flex; flex-direction: column; gap: 8px;">
        <span class="tg-title" style="color: #00d2ff; font-weight: bold; font-size: 13px;">✈️ TELEGRAM CHANNEL</span>
        <a href="${tgUrl}" target="_blank" class="tg-btn" style="background: #0288d1; color: white !important; text-decoration: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; font-size: 13px;">✈️ Unirse al Canal de Telegram</a>
    </div>
    <div class="airing-info" style="display: flex; flex-direction: column; gap: 8px; align-items: flex-end;">
        <div class="date-badge" style="border: 1px solid #00ffcc; color: #00ffcc; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold;">📅 Estreno: ${estrenoFecha}</div>
        <div class="countdown-badge" style="border: 1px solid #ff0055; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; animation: color-gif 1.5s infinite linear;">
            ⚡ EP. <span>${nextEpNumber}</span>
        </div>
    </div>
</div>

${trailerHtml}

${charactersHTML}

<script type='text/javascript'>
  var label_episode = '${labelName}';
<\/script>`;

            try {
                statusEl.innerText = "🚀 Publicando en Blogger...";
                const bloggerRes = await fetch(`https://www.googleapis.com/blogger/v3/blogs/${blogId}/posts/`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${googleAccessToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: title, content: contentHtml, labels: tags })
                });

                if(!bloggerRes.ok) throw new Error("Error al publicar en Blogger.");

                statusEl.innerText = "💾 Guardando en Firestore...";
                await addDoc(collection(db, "anime_series"), {
                    aniId: parseInt(animeId),
                    title: labelName,
                    status: readableStatus,
                    tags: tags,
                    createdAt: new Date().toISOString()
                });

                statusEl.innerText = "✅ ¡Serie publicada correctamente!";
                document.getElementById('seriesResultCode').value = `Publicado: ${title}\nEtiquetas: ${tags.join(", ")}`;
                loadDatabaseSeries();
            } catch(e) {
                statusEl.innerText = "❌ Error: " + e.message;
            } finally {
                btn.disabled = false;
            }
        };

        let cachedEpisodeData = null;

        window.fetchEpisodeDataForEdit = async function() {
            const aniId = document.getElementById('epAniId').value.trim();
            let epNum = document.getElementById('epNum').value.trim();
            const statusEl = document.getElementById('epStatus');
            const epHistoryInfo = document.getElementById('epHistoryInfo');

            if(!aniId) { alert("Ingresa el AniList ID de la serie."); return; }
            statusEl.innerText = "⏳ Consultando historial de la serie en Firebase y AniList...";

            try {
                const epQuery = query(collection(db, "anime_episodes"), where("aniId", "==", parseInt(aniId)));
                const epDocs = await getDocs(epQuery);

                let subidos = [];
                let maxEpFound = 0;

                epDocs.forEach(d => {
                    let data = d.data();
                    let epVal = parseInt(data.epNum);
                    if(!isNaN(epVal)) {
                        subidos.push(epVal);
                        if(epVal > maxEpFound) maxEpFound = epVal;
                    }
                });

                subidos.sort((a,b) => a - b);

                if (subidos.length > 0) {
                    epHistoryInfo.style.display = "block";
                    epHistoryInfo.innerHTML = `📊 Episodios en base de datos: <b>[ ${subidos.join(", ")} ]</b> | Último subido: <b>EP ${maxEpFound}</b>`;
                    if (!epNum) {
                        epNum = (maxEpFound + 1).toString();
                        document.getElementById('epNum').value = epNum;
                    }
                } else {
                    epHistoryInfo.style.display = "block";
                    epHistoryInfo.innerHTML = `ℹ️ No hay episodios registrados anteriormente para esta serie.`;
                    if (!epNum) { epNum = "1"; document.getElementById('epNum').value = "1"; }
                }

                const q = `query ($id: Int) { Media (id: $id, type: ANIME) { title { romaji english } coverImage { extraLarge } } }`;
                const response = await fetch('https://graphql.anilist.co', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ query: q, variables: { id: parseInt(aniId) } })
                });
                const resData = await response.json();
                if(resData.errors) { statusEl.innerText = "❌ Error: ID de Serie no encontrado en AniList."; return; }

                const anime = resData.data.Media;
                const defaultTitle = anime.title.romaji || anime.title.english;
                const img = anime.coverImage.extraLarge || '';

                cachedEpisodeData = { img, defaultTitle };

                document.getElementById('editEpAnimeName').value = defaultTitle;
                document.getElementById('editEpTitle').value = `${defaultTitle} - ${epNum}`;
                document.getElementById('epEditBox').style.display = 'block';
                statusEl.innerText = `✏️ Listo. Se sugiere el Episodio ${epNum}. Modifica si es necesario y publica.`;
            } catch(e) {
                statusEl.innerText = "❌ Error: " + e.message;
            }
        };

        window.generateEpisodeCode = async function() {
            const btn = document.getElementById('btnPublishEp');
            btn.disabled = true;

            const blogId = document.getElementById('blogIdEp').value.trim();
            const aniId = document.getElementById('epAniId').value.trim();
            const epNum = document.getElementById('epNum').value.trim();
            const statusEl = document.getElementById('epStatus');

            if(!cachedEpisodeData) { alert("Primero haz clic en 'Cargar y Consultar Episodios' para obtener los datos."); btn.disabled = false; return; }
            if(!blogId) { alert("Ingresa tu Blog ID de Blogger."); btn.disabled = false; return; }
            if(!googleAccessToken) { alert("Primero conéctate a la API de Blogger."); btn.disabled = false; return; }

            const postTitle = document.getElementById('editEpTitle').value.trim();
            const animeTag = document.getElementById('editEpAnimeName').value.trim();
            const img = cachedEpisodeData.img;

            const sF = document.getElementById('idFast').value.trim();
            const s6 = document.getElementById('idWish').value.trim();
            const s7 = document.getElementById('idVoe').value.trim();
            const sH = document.getElementById('idHide').value.trim();
            const sTape = document.getElementById('idTape').value.trim();
            const sDood = document.getElementById('idDood').value.trim();

            const dlStreamHG = document.getElementById('dlStreamHG').value.trim();
            const dlVoe = document.getElementById('dlVoe').value.trim();
            const dlEarnvids = document.getElementById('dlEarnvids').value.trim();
            const dlVip = document.getElementById('dlVip').value.trim();

            // CONSTRUCCIÓN CON MEZCLA ALEATORIA (RANDOM) DE SERVIDORES
            let serverList = [];
            if(s6) serverList.push({ name: 'Streamwish ⭐', url: `https://streamwish.to/e/${s6}` });
            if(s7) serverList.push({ name: 'VOE ⭐', url: `https://voe.sx/e/${s7}` });
            if(sH) serverList.push({ name: 'Hide 🔒', url: `https://morencius.com/embed/${sH}` });
            if(sTape) serverList.push({ name: 'Streamtape 📹', url: sTape.startsWith('http') ? sTape : `https://streamtape.com/e/${sTape}` });
            if(sDood) serverList.push({ name: 'Doodstream 🎬', url: sDood.startsWith('http') ? sDood : `https://dood.so/e/${sDood}` });

            // Mezcla Aleatoria (Fisher-Yates)
            for (let i = serverList.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [serverList[i], serverList[j]] = [serverList[j], serverList[i]];
            }

            let options = '<option value="">Select Video Server</option>';
            if(sF) options += `<option value="https://player.animev1.net/?v=${sF}">Fast ⚡</option>`;

            serverList.forEach(s => {
                options += `<option value="${s.url}">${s.name}</option>`;
            });

            // RESPALDO INTELIGENTE: Si no hay ID Fast, toma automáticamente el primer servidor de la lista aleatoria
            let firstFrame = sF ? `https://player.animev1.net/?v=${sF}` : (serverList.length > 0 ? serverList[0].url : '');

            let filasDescargaHTML = "";
            if(dlStreamHG) filasDescargaHTML += `<li><span>Stream HG</span><span style="text-align: center;">Sub</span><span><a href="${dlStreamHG}" class="download-btn" rel="nofollow" target="_blank">Download</a></span></li>`;
            if(dlVoe) filasDescargaHTML += `<li><span>VOE</span><span style="text-align: center;">Sub</span><span><a href="${dlVoe}" class="download-btn" rel="nofollow" target="_blank">Download</a></span></li>`;
            if(dlEarnvids) filasDescargaHTML += `<li><span>Earnvids</span><span style="text-align: center;">Sub</span><span><a href="${dlEarnvids}" class="download-btn" rel="nofollow" target="_blank">Download</a></span></li>`;

            let seccionDescargaCompleta = "";
            if (filasDescargaHTML !== "" || dlVip) {
                seccionDescargaCompleta += `
<style>
  @keyframes rgbGlowText { 0% { color: #ff0055; text-shadow: 0 0 10px rgba(255,0,85,0.6); } 33% { color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.6); } 66% { color: #f59e0b; text-shadow: 0 0 10px rgba(245,158,11,0.6); } 100% { color: #ff0055; text-shadow: 0 0 10px rgba(255,0,85,0.6); } }
  .av-download-title { text-align: center !important; font-size: 1.2rem !important; font-weight: 800 !important; text-transform: uppercase !important; animation: rgbGlowText 5s infinite !important; margin: 20px 0 15px 0 !important; }
  .dl-box-rgb { background: #0f172a; border: 2px solid rgba(0, 240, 255, 0.3); border-radius: 12px; padding: 15px; box-shadow: 0 0 20px rgba(0,240,255,0.1); margin-bottom: 20px; }
  .dl-box-rgb ul { list-style: none; padding: 0; margin: 0; }
  .dl-box-rgb li { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 0.9rem; color: #fff; }
  .dl-box-rgb li.head { background: rgba(0, 240, 255, 0.1); font-weight: bold; color: #00ffcc; border-radius: 6px; border-bottom: none; }
  .dl-box-rgb li span { flex: 1; text-align: center; }
  .dl-box-rgb li span:first-child { text-align: left; font-weight: 600; }
  .dl-box-rgb li span:last-child { text-align: right; }
  .dl-box-rgb a.download-btn { background: linear-gradient(135deg, #00f0ff, #3b82f6); color: #000; padding: 6px 16px; border-radius: 6px; font-weight: bold; text-decoration: none; font-size: 0.8rem; text-transform: uppercase; transition: 0.3s; }
  .dl-box-rgb a.download-btn:hover { box-shadow: 0 0 12px rgba(0,240,255,0.8); color: #fff; }
  .vip-gold-box { background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%); border: 2px solid #f59e0b; border-radius: 12px; padding: 18px; text-align: center; margin-top: 15px; box-shadow: 0 0 25px rgba(245,158,11,0.25); }
  .vip-badge { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; font-size: 0.7rem; font-weight: 900; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; display: inline-block; margin-bottom: 8px; }
  .vip-gold-btn { background: linear-gradient(135deg, #f59e0b, #b45309); color: #ffffff !important; padding: 10px 22px; border-radius: 8px; font-weight: 800; text-decoration: none; display: inline-block; font-size: 0.85rem; text-transform: uppercase; box-shadow: 0 0 15px rgba(245,158,11,0.4); margin-top: 10px; }
</style>

<h3 class="av-download-title">📥 Descargar ${postTitle}</h3>`;

                if (filasDescargaHTML !== "") {
                    seccionDescargaCompleta += `
<div class="dl-box-rgb">
  <ul>
    <li class="head">
      <span>Server</span>
      <span style="text-align: center;">Audio</span>
      <span style="text-align: right;">Download</span>
    </li>
    ${filasDescargaHTML}
  </ul>
</div>`;
                }

                if (dlVip) {
                    seccionDescargaCompleta += `
<div class="vip-gold-box">
  <span class="vip-badge">👑 INSIGNIA VIP EXCLUSIVA</span>
  <h4 style="color: #facc15; margin: 5px 0 8px 0; font-size: 1rem; text-transform: uppercase;">Descarga VIP Alta Velocidad</h4>
  <p style="color: #cbd5e1; font-size: 0.82rem; margin: 0 0 12px 0;">Acceso directo al servidor premium sin publicidad ni esperas.</p>
  <a href="${dlVip}" class="vip-gold-btn" target="_blank" rel="nofollow">🚀 Abrir Enlace VIP Dorado</a>
</div>`;
                }
            }

            const contentHtml = `
<div style="text-align: justify;">
    <div style="margin: 20px 0px; text-align: center;">
        <a class="anime-btn anim-gif-border" href="https://millionairelucidlytransmitted.com/dwwq7qu6?key=d20b3494a8bba94805f7341046936750" rel="nofollow" target="_blank" style="background: #111; border-radius: 5px; color: white !important; display: inline-block; font-weight: bold; padding: 12px 8%; text-decoration: none; text-transform: uppercase; border: 2px solid #ff0055;">⚠️ Apoya la web con un click ⚠️</a>
    </div>

    <div class="separator" style="text-align: center;"><img src="${img}" /></div>
    <div id="box-movie">
        <div class="bixbox streaming">
            <div class="tvideo" id="plv"><div id="content"><iframe allowfullscreen="yes" frameborder="0" height="100%" src="${firstFrame}" width="100%"></iframe></div></div>
            <div class="item video-nav">
                <div class="mobius">
                    <select class="selectServ" id="selectServ" onchange="loadMi(this)">${options}</select>
                </div>
            </div>
        </div>
    </div>
    <h3 style="text-align: center; color: #ff0055; margin-top: 15px;">${postTitle}</h3>
    
    ${seccionDescargaCompleta}
</div>`;

            const epTags = ["Episode", "Sub", animeTag];

            try {
                statusEl.innerText = "🚀 Publicando Episodio en Blogger...";
                const bloggerRes = await fetch(`https://www.googleapis.com/blogger/v3/blogs/${blogId}/posts/`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${googleAccessToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: postTitle, content: contentHtml, labels: epTags })
                });

                if(!bloggerRes.ok) throw new Error("Error al publicar episodio en Blogger.");

                statusEl.innerText = "💾 Guardando registro de episodio en Firebase...";
                await addDoc(collection(db, "anime_episodes"), {
                    aniId: parseInt(aniId),
                    epNum: parseInt(epNum),
                    title: postTitle,
                    createdAt: new Date().toISOString()
                });

                statusEl.innerText = "✅ ¡Episodio publicado y registrado correctamente!";
                document.getElementById('epResultCode').value = `Publicado: ${postTitle}\nEtiquetas: ${epTags.join(", ")}`;
                loadDatabaseSeries();
            } catch(e) {
                statusEl.innerText = "❌ Error: " + e.message;
            } finally {
                btn.disabled = false;
            }
        };

        window.clearEpisodeForm = function() {
            document.getElementById('epAniId').value = '';
            document.getElementById('epNum').value = '';
            document.getElementById('idFast').value = '';
            document.getElementById('idWish').value = '';
            document.getElementById('idVoe').value = '';
            document.getElementById('idHide').value = '';
            document.getElementById('idTape').value = '';
            document.getElementById('idDood').value = '';
            document.getElementById('dlStreamHG').value = '';
            document.getElementById('dlVoe').value = '';
            document.getElementById('dlEarnvids').value = '';
            document.getElementById('dlVip').value = 'https://sub.animev1.net/';
            document.getElementById('epResultCode').value = '';
            document.getElementById('epEditBox').style.display = 'none';
            document.getElementById('epHistoryInfo').style.display = 'none';
            document.getElementById('epStatus').innerText = 'Formulario limpio.';
        };
    </script>
</head>
<body>

    <div id="authView" class="auth-box" style="max-width: 400px;">
        <h2>🔐 Acceso Admin</h2>
        <div class="input-group" style="margin-top: 20px;">
            <label>Correo Electrónico</label>
            <input type="email" id="email" placeholder="admin@animev1.net">
        </div>
        <div class="input-group">
            <label>Contraseña</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button onclick="loginUser()">Ingresar al Panel</button>
    </div>

    <div id="dashboardView" class="dashboard" style="display: none;">
        <div class="logout-bar">
            <span style="font-size: 13px; color: #9ca3af;">Conectado como: <b id="userEmailDisplay" style="color: var(--cyan);"></b></span>
            <button class="logout-btn" onclick="logoutUser()">Cerrar Sesión</button>
        </div>

        <h2>⚡ Panel Centralizado Anime V1</h2>

        <div class="google-auth-box">
            <div>
                <span style="font-size: 12px; font-weight: bold; text-transform: uppercase; color: var(--cyan); display: block;">Permisos de Google Blogger</span>
                <span id="googleAuthStatus" style="font-size: 12px; color: #fbbf24;">🔴 Desconectado de Blogger</span>
            </div>
            <button onclick="connectBlogger()" style="width: auto; background: #2563eb; margin-top: 0;">Conectar Cuenta Google</button>
        </div>

        <div class="nav-tabs">
            <button class="active" onclick="switchTab('series', event)">📺 Publicar Serie</button>
            <button onclick="switchTab('episodes', event)">🎬 Publicar Episodio</button>
            <button onclick="switchTab('database', event)">🗄️ Base de Datos</button>
        </div>

        <div id="tab-series" class="tab-pane active">
            <div class="row">
                <div>
                    <label>Fuente de Datos:</label>
                    <select id="dataSource">
                        <option value="anilist">AniList</option>
                        <option value="mal">MyAnimeList (MAL)</option>
                    </select>
                </div>
                <div><label>ID de Anime:</label><input type="number" id="seriesAniId" placeholder="Ej: 21"></div>
            </div>
            <div class="row">
                <div><label>Blog ID de Blogger:</label><input type="text" id="blogId" value="5938297539101113182"></div>
                <div><label>Link Canal Telegram:</label><input type="text" id="telegramUrl" value="https://t.me/animev1net"></div>
            </div>
            <div id="seriesStatus" class="status-msg">Ingresa un ID de serie y haz clic en Cargar...</div>
            <button class="btn-preview" onclick="fetchSeriesDataForEdit()">🔍 Cargar y Editar Serie</button>

            <div id="seriesEditBox" class="preview-edit-box">
                <div class="input-group">
                    <label>Nombre Principal para Etiquetas (Ej: One Piece):</label>
                    <input type="text" id="editSeriesLabelName">
                </div>
                <div class="input-group">
                    <label>Título del Anime (Post Title):</label>
                    <input type="text" id="editSeriesTitle">
                </div>
                <div class="input-group">
                    <label>Sinopsis en Español:</label>
                    <textarea id="editSeriesDesc" style="height: 100px;"></textarea>
                </div>
            </div>
            <button id="btnPublishSeries" onclick="generateAndSaveSeries()">🚀 Publicar Serie en Blogger & Firestore</button>
            <textarea id="seriesResultCode" placeholder="Resultados..." readonly></textarea>
        </div>

        <div id="tab-episodes" class="tab-pane">
            <div class="row">
                <div><label>Blog ID de Blogger:</label><input type="text" id="blogIdEp" value="5938297539101113182"></div>
            </div>
            <div class="row">
                <div><label>AniList ID (Serie):</label><input type="number" id="epAniId" placeholder="Ej: 206814"></div>
                <div><label>Nº de Episodio:</label><input type="text" id="epNum" placeholder="Ej: 4"></div>
            </div>

            <div id="epHistoryInfo" class="history-badge" style="display: none;"></div>

            <button class="btn-preview" onclick="fetchEpisodeDataForEdit()">🔍 1. Cargar y Consultar Episodios</button>

            <div id="epEditBox" class="preview-edit-box">
                <div class="input-group">
                    <label>Nombre del Anime para Etiqueta (Ej: Dragon Ball Super):</label>
                    <input type="text" id="editEpAnimeName">
                </div>
                <div class="input-group">
                    <label>Título del Post (Ej: Dragon Ball Super - Episode 4):</label>
                    <input type="text" id="editEpTitle">
                </div>
            </div>

            <div class="server-section">
                <div class="server-section-title">📺 Servidores de Video (IDs)</div>
                <div class="row">
                    <div><label>ID Fast / Video (Opcional)</label><input type="text" id="idFast" placeholder="Ej: pSYWS7BYg"></div>
                    <div><label>ID Streamwish</label><input type="text" id="idWish" placeholder="Ej: pcs94xfgl99i"></div>
                </div>
                <div class="row">
                    <div><label>ID VOE.SX</label><input type="text" id="idVoe" placeholder="Ej: rq9mviohb2n1"></div>
                    <div><label>ID Hide / Earnvids</label><input type="text" id="idHide" placeholder="Ej: zi8ld9k00dbb"></div>
                </div>
                <div class="row">
                    <div><label>ID Streamtape</label><input type="text" id="idTape" placeholder="Ej: 6J8vK..."></div>
                    <div><label>ID Doodstream</label><input type="text" id="idDood" placeholder="Ej: pass_md5..."></div>
                </div>
            </div>

            <div class="server-section">
                <div class="server-section-title">📥 Enlaces de Descarga Opcionales</div>
                <div class="row">
                    <div><label>Link Descarga Stream HG</label><input type="text" id="dlStreamHG" placeholder="https://streamhg.to/d/..."></div>
                    <div><label>Link Descarga VOE</label><input type="text" id="dlVoe" placeholder="https://voe.sx/d/..."></div>
                </div>
                <div class="row">
                    <div><label>Link Descarga Earnvids</label><input type="text" id="dlEarnvids" placeholder="https://earnvids.com/d/..."></div>
                    <div><label>Link VIP / TeraBox 👑</label><input type="text" id="dlVip" value="https://sub.animev1.net/" placeholder="https://sub.animev1.net/"></div>
                </div>
            </div>

            <div id="epStatus" class="status-msg">Listo para episodio...</div>
            <button id="btnPublishEp" onclick="generateEpisodeCode()">🚀 2. Publicar Episodio en Blogger</button>
            <button class="btn-clear" onclick="clearEpisodeForm()">🧹 Limpiar Formulario</button>
            <textarea id="epResultCode" placeholder="Estado del episodio..." readonly></textarea>
        </div>

        <div id="dbListContainer" class="tab-pane">
            <!-- Pestaña Base de Datos -->
        </div>
    </div>

    <script>
        function switchTab(tabName, event) {
            document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-tabs button').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
