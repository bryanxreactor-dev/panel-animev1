<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Profesional - Anime V1</title>
    <style>
        :root { --accent: #ff0055; --bg: #0b0f19; --card: #111827; --cyan: #00ffcc; --text: #f3f4f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .auth-box, .dashboard { max-width: 1000px; margin: 30px auto; background: var(--card); padding: 30px; border-radius: 12px; border: 1px solid #1f2937; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 25px; }
        
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; color: var(--cyan); margin-bottom: 5px; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }
        input, select { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #374151; background: #030712; color: #fff; box-sizing: border-box; font-size: 14px; }
        input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 8px rgba(255,0,85,0.3); }
        
        button { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; width: 100%; transition: 0.3s; font-size: 13px; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 1px solid #1f2937; padding-bottom: 12px; }
        .nav-tabs button { flex: 1; background: #1f2937; color: #9ca3af; }
        .nav-tabs button.active { background: var(--accent); color: #fff; }
        
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        
        .row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 15px; }
        .logout-bar { display: flex; justify-content: space-between; align-items: center; background: #030712; padding: 10px 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #1f2937; }
        .logout-btn { background: #374151; color: #f87171; width: auto; padding: 6px 15px; font-size: 11px; }
        
        textarea { width: 100%; height: 180px; background: #030712; color: var(--cyan); border: 1px solid #374151; padding: 15px; font-family: monospace; border-radius: 8px; box-sizing: border-box; margin-top: 15px; font-size: 12px; resize: none; }
        .status-msg { text-align: center; font-size: 13px; font-weight: bold; margin-top: 10px; min-height: 20px; color: #fbbf24; }
        .server-section { background: #030712; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #1f2937; }
    </style>

    <!-- Firebase SDK Modular y Auth/Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAl1LauNyrok_RCHnfQcPYJZj6d2FMeL9Y",
            authDomain: "panel-animev1-eda50.firebaseapp.com",
            projectId: "panel-animev1-eda50",
            storageBucket: "panel-animev1-eda50.firebasestorage.app",
            messagingSenderId: "77184385205",
            appId: "1:77184385205:web:349a3adad987c04e303efc",
            measurementId: "G-Z86WC7H1C2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Control de sesión activa
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('authView').style.display = 'none';
                document.getElementById('dashboardView').style.display = 'block';
                document.getElementById('userEmailDisplay').innerText = user.email;
                loadDatabaseSeries(); // Cargar base de datos al entrar
            } else {
                document.getElementById('authView').style.display = 'block';
                document.getElementById('dashboardView').style.display = 'none';
            }
        });

        window.loginUser = function() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, pass)
                .catch(error => alert("Error de acceso: " + error.message));
        };

        window.logoutUser = function() {
            signOut(auth);
        };

        // Función para cargar series guardadas en Firestore
        async function loadDatabaseSeries() {
            const container = document.getElementById('dbListContainer');
            container.innerHTML = "Cargando series desde Firestore...";
            try {
                const querySnapshot = await getDocs(collection(db, "anime_series"));
                if(querySnapshot.empty) {
                    container.innerHTML = "No hay series registradas en la base de datos todavía.";
                    return;
                }
                let html = "<ul style='list-style:none; padding:0; text-align:left;'>";
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    html += `<li style="background:#111827; padding:10px; margin-bottom:8px; border-radius:5px; border-left:3px solid #ff0055;">
                        <b>ID AniList:</b> ${data.aniId} | <b>Título:</b> ${data.title} | <b>Estado:</b> <span style="color:#00ffcc;">${data.status}</span>
                    </li>`;
                });
                html += "</ul>";
                container.innerHTML = html;
            } catch(e) {
                container.innerHTML = "Error al cargar la base de datos: " + e.message;
            }
        }

        // Exportar db y collection para uso en funciones globales si es necesario
        window.dbRef = { db, collection, addDoc };
    </script>
</head>
<body>

    <!-- VISTA 1: LOGIN -->
    <div id="authView" class="auth-box" style="max-width: 400px;">
        <h2>🔐 Acceso Admin</h2>
        <div class="input-group" style="margin-top: 20px;">
            <label>Correo Electrónico</label>
            <input type="email" id="email" placeholder="admin@animev1.net">
        </div>
        <div class="input-group">
            <label>Contraseña</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button onclick="loginUser()" style="margin-top: 10px;">Ingresar al Panel</button>
    </div>

    <!-- VISTA 2: PANEL DE CONTROL (DASHBOARD) -->
    <div id="dashboardView" class="dashboard" style="display: none;">
        <div class="logout-bar">
            <span style="font-size: 13px; color: #9ca3af;">Conectado como: <b id="userEmailDisplay" style="color: var(--cyan);"></b></span>
            <button class="logout-btn" onclick="logoutUser()">Cerrar Sesión</button>
        </div>

        <h2>⚡ Panel Centralizado Anime V1</h2>

        <!-- Pestañas de Navegación -->
        <div class="nav-tabs">
            <button class="active" onclick="switchTab('series', event)">📺 Publicar Serie</button>
            <button onclick="switchTab('episodes', event)">🎬 Publicar Episodio</button>
            <button onclick="switchTab('database', event)">🗄️ Base de Datos (AniList)</button>
        </div>

        <!-- Pestaña 1: Publicar Serie -->
        <div id="tab-series" class="tab-pane active">
            <div class="row">
                <div><label>AniList ID (Serie):</label><input type="number" id="seriesAniId" placeholder="Ej: 21"></div>
                <div><label>Contraseña VIP:</label><input type="text" id="seriesVipPass" value="1234"></div>
            </div>
            <div class="row">
                <div><label>Blog ID de Blogger:</label><input type="text" id="blogId" placeholder="Tu Blog ID numérico"></div>
                <div><label>Link Canal Telegram:</label><input type="text" id="telegramUrl" value="https://t.me/animev1net"></div>
            </div>
            <div class="server-section">
                <label style="color: var(--cyan); margin-bottom: 8px; display: block;">Enlaces Sub Español & Latino</label>
                <div class="row">
                    <input type="text" id="teraSub" placeholder="Link Terabox Sub">
                    <input type="text" id="driveSub" placeholder="Link G-Drive Sub">
                </div>
                <div class="row" style="margin-top: 10px;">
                    <input type="text" id="teraLat" placeholder="Link Terabox Latino">
                    <input type="text" id="driveLat" placeholder="Link G-Drive Latino">
                </div>
            </div>
            <div id="seriesStatus" class="status-msg">Listo para consultar AniList y registrar serie...</div>
            <button onclick="generateAndSaveSeries()">🚀 Generar y Registrar Serie en Firestore</button>
            <textarea id="seriesResultCode" placeholder="Código HTML generado..." readonly></textarea>
        </div>

        <!-- Pestaña 2: Publicar Episodio -->
        <div id="tab-episodes" class="tab-pane">
            <div class="row">
                <div><label>AniList ID (Serie):</label><input type="number" id="epAniId" placeholder="Ej: 21"></div>
                <div><label>Nº de Episodio:</label><input type="text" id="epNum" placeholder="Ej: 01"></div>
            </div>
            <div class="server-section">
                <label style="color: var(--cyan); margin-bottom: 8px; display: block;">IDs de Servidores de Video</label>
                <div class="row">
                    <div><label>Fast ID</label><input type="text" id="idFast" placeholder="Ej: pSYWS7BYg"></div>
                    <div><label>Streamwish ID</label><input type="text" id="idWish" placeholder="Ej: pcs94xfgl99i"></div>
                </div>
                <div class="row" style="margin-top: 10px;">
                    <div><label>VOE ID</label><input type="text" id="idVoe" placeholder="Ej: rq9mviohb2n1"></div>
                    <div><label>Hide ID</label><input type="text" id="idHide" placeholder="Ej: zi8ld9k00dbb"></div>
                </div>
            </div>
            <div id="epStatus" class="status-msg">Listo para generar episodio...</div>
            <button onclick="generateEpisodeCode()">🚀 Generar Código de Episodio</button>
            <textarea id="epResultCode" placeholder="Código HTML del episodio..." readonly></textarea>
        </div>

        <!-- Pestaña 3: Base de Datos / Monitoreo AniList -->
        <div id="tab-database" class="tab-pane">
            <p style="font-size: 13px; color: #9ca3af; margin-bottom: 15px;">Listado de series registradas en Firestore. Aquí podrás verificar su estado en tiempo real con AniList.</p>
            <div id="dbListContainer" style="background: #030712; padding: 20px; border-radius: 8px; border: 1px solid #1f2937; min-height: 150px; text-align: center; color: #6b7280;">
                Cargando series...
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabName, event) {
            document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-tabs button').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Lógica base para conectar AniList en la pestaña de series
        async function generateAndSaveSeries() {
            const aniId = document.getElementById('seriesAniId').value.trim();
            const statusEl = document.getElementById('seriesStatus');
            if(!aniId) {
                alert("Ingresa un ID de AniList válido.");
                return;
            }
            statusEl.innerText = "⏳ Consultando AniList...";

            const query = `query ($id: Int) { Media (id: $id, type: ANIME) { id title { romaji english } description status coverImage { extraLarge } } }`;
            try {
                const response = await fetch('https://graphql.anilist.co', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ query, variables: { id: parseInt(aniId) } })
                });
                const resData = await response.json();
                if(resData.errors) {
                    statusEl.innerText = "❌ Error: ID no encontrado en AniList.";
                    return;
                }
                const anime = resData.data.Media;
                const title = anime.title.romaji || anime.title.english;
                
                // Guardar en Firestore
                statusEl.innerText = "💾 Guardando en Firestore...";
                await window.dbRef.addDoc(window.dbRef.collection(window.dbRef.db, "anime_series"), {
                    aniId: parseInt(aniId),
                    title: title,
                    status: anime.status,
                    createdAt: new Date().toISOString()
                });

                statusEl.innerText = "✅ ¡Serie procesada y guardada en la base de datos!";
                document.getElementById('seriesResultCode').value = `<!-- Serie: ${title} [AniList ID: ${aniId}] - Estado: ${anime.status} -->`;
            } catch(e) {
                statusEl.innerText = "❌ Error: " + e.message;
            }
        }

        function generateEpisodeCode() {
            const epNum = document.getElementById('epNum').value.trim();
            if(!epNum) {
                alert("Ingresa el número de episodio.");
                return;
            }
            document.getElementById('epResultCode').value = `<!-- Código de Episodio ${epNum} generado correctamente -->`;
            document.getElementById('epStatus').innerText = "✅ Episodio generado con éxito.";
        }
    </script>
</body>
</html>
